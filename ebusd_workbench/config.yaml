name: ebusd Config Workbench
version: "0.4.0"
slug: ebusd_workbench
description: >
  Work on ebusd message definitions: browse the recorded eBUS telegrams of the eBUSd app
  on a timeline next to Home Assistant entity changes, edit TypeSpec sources in a git
  repository, compile them to CSV and test them against real telegrams in the browser.
url: https://github.com/LukasGrebe/ha-addons/tree/main/ebusd_workbench
arch:
  - aarch64
  - amd64

init: false
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline
panel_title: ebusd Config Workbench
homeassistant_api: true
map:
  - app_config:rw
  - share:rw
options:
  database: /share/ebusd/telegrams.db
  deploy_path: /share/ebusd/config
  repo_url: ""
  git_user_name: ""
  git_user_email: ""
  git_token: ""
schema:
  database: str
  deploy_path: str
  repo_url: "str?"
  git_user_name: "str?"
  git_user_email: "str?"
  git_token: "password?"
