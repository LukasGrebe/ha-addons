name: ebusd Config Workbench
version: "0.5.4"
slug: ebusd_workbench
description: >
  Find the ebusd message definitions that fit your eBUS devices: the telegrams the eBUSd app
  records, every definition that decodes them (release, upcoming release, pull requests, your
  own), tuned, named and saved as the configuration of the eBUSd app and Home Assistant.
url: https://github.com/LukasGrebe/ha-addons/tree/main/ebusd_workbench
arch:
  - aarch64
  - amd64

init: false
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline
panel_title: ebusd Config Workbench
homeassistant_api: true
map:
  - app_config:rw
  - share:rw
options:
  database: /share/ebusd/telegrams.db
  deploy_path: /share/ebusd/config
  language: en
schema:
  database: str
  deploy_path: str
  language: list(en|de)
