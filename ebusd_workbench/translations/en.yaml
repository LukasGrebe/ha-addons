configuration:
  database:
    name: Telegram database
    description: >
      The SQLite telegram log written by the eBUSd app (its option "SQLite telegram log").
      Both apps must use the same path, e.g. /share/ebusd/telegrams.db. Home Assistant
      entity changes recorded by the Workbench are stored in the same file (table "ha_state").
  deploy_path:
    name: Deploy folder for the CSV files of your setup
    description: >
      Folder the message definitions of your setup are written to, e.g. /share/ebusd/config.
      Point the eBUSd app at it with --configpath=/share/ebusd/config.
  language:
    name: Language of the definitions
    description: >
      The language of the field names and comments in the definitions (the "en" or "de" folder
      of ebus.github.io). Use the same as the eBUSd app (its --configlang, English unless set).
