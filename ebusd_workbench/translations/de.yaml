configuration:
  database:
    name: Telegramm-Datenbank
    description: >
      Das SQLite-Telegrammprotokoll der eBUSd-App (deren Option "SQLite telegram log").
      Beide Apps müssen denselben Pfad verwenden, z. B. /share/ebusd/telegrams.db. Von der
      Workbench aufgezeichnete Zustandsänderungen von Home-Assistant-Entitäten werden in
      derselben Datei gespeichert (Tabelle "ha_state").
  deploy_path:
    name: Zielordner für die CSV-Dateien deiner Konfiguration
    description: >
      Ordner, in den die Nachrichtendefinitionen deiner Konfiguration geschrieben werden,
      z. B. /share/ebusd/config. In der eBUSd-App mit --configpath=/share/ebusd/config
      verwenden.
  language:
    name: Sprache der Definitionen
    description: >
      Sprache der Feldnamen und Kommentare in den Definitionen (der Ordner "en" oder "de"
      von ebus.github.io). Dieselbe wie in der eBUSd-App verwenden (deren --configlang,
      ohne Angabe Englisch).
