<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebusd Config Workbench</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt="" width="22" height="22"> <span>ebusd Config Workbench</span></div>
  <div class="activity" id="activity"></div>
  <div class="status" id="status"></div>
</header>
<div id="sources" class="sources"></div>
<main class="page">
  <section id="bus" class="bus" aria-label="the messages on the bus">
    <div id="messages" class="bus-view"></div>
  </section>
  <aside id="setup" class="setup" aria-label="my setup"></aside>
</main>
<footer id="extras" class="extras"></footer>
<div id="toasts" class="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
