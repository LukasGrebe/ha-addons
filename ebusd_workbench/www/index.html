<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebusd Config Workbench</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt="" width="22" height="22"> <span>ebusd Config Workbench</span></div>
  <div class="activity" id="activity"></div>
  <div class="status" id="status"></div>
</header>
<div id="sources" class="sources"></div>
<main class="page">
  <div class="left">
    <section id="bus" class="bus" aria-label="the bus">
      <div class="bus-head">
        <b>Messages on the bus</b>
        <span class="seg" id="bus-views"><button data-view="table" class="active" title="one row per message, what needs a look first">list</button><button data-view="timeline" title="the telegrams over time, with Home Assistant events and your notes">timeline</button></span>
      </div>
      <div id="messages" class="bus-view"></div>
      <div id="timeline" class="bus-view" style="display:none"></div>
    </section>
    <div id="pad-handle" class="pad-handle" title="drag to give the bus or the scratchpad more room"></div>
    <section id="pad" class="pad" aria-label="scratchpad"></section>
  </div>
  <aside id="setup" class="setup" aria-label="my setup"></aside>
</main>
<footer id="extras" class="extras"></footer>
<div id="toasts" class="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
