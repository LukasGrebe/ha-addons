name: Update ebusd
# Checks for new john30/ebusd releases and opens a PR against next that bumps:
#   - ebusd/config.yaml  version field  (single source of truth; HA Supervisor reads this)
#   - ebusd/Dockerfile   FROM tag       (kept in sync for readability)
#
# Triggers:
#   1. Weekly schedule  — catches any release automatically
#   2. workflow_dispatch — run manually at any time

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write  # start CI for the PR (PRs opened with GITHUB_TOKEN trigger no workflows)

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: next

      - name: Get latest ebusd release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh api repos/john30/ebusd/releases/latest)
          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest ebusd release: ${VERSION}"

      - name: Get current version from config.yaml
        id: current
        run: |
          # Strip trailing patch number (.0, .1, .2 …) to get the upstream version.
          # Container releases append a patch suffix (e.g. 26.1.1) that must be
          # ignored when comparing against upstream tags (e.g. v26.1).
          VERSION=$(grep '^version:' ebusd/config.yaml \
            | sed 's/version: "\([0-9]*\.[0-9]*\)\.[0-9]*"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current: ${VERSION}"

      - name: Check if update is needed
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: $CURRENT → $LATEST"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $LATEST"
          fi

      - name: Check that the upstream image is published
        id: image
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          # the GitHub release can come before the Docker Hub images
          if ! manifest=$(docker buildx imagetools inspect --raw "john30/ebusd:v${VERSION}" 2>&1); then
            if [[ "$manifest" != *"not found"* && "$manifest" != *"MANIFEST_UNKNOWN"* ]]; then
              echo "::error::Could not check john30/ebusd:v${VERSION}: $manifest"
              exit 1
            fi
            manifest='{}'
          fi
          platforms=$(jq -r '.manifests[]?.platform.architecture' <<< "$manifest")
          if grep -qx amd64 <<< "$platforms" && grep -qx arm64 <<< "$platforms"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::john30/ebusd:v${VERSION} is not published for amd64 and arm64 yet, trying again next week"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update config.yaml, Dockerfile, and CHANGELOG.md
        if: steps.image.outputs.ready == 'true'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          # config.yaml: HA Supervisor version format is X.Y.0
          sed -i "s/^version:.*/version: \"${VERSION}.0\"/" ebusd/config.yaml
          # Dockerfile: Docker Hub image uses "v" prefix; GitHub tag does not
          sed -i "s|FROM john30/ebusd:v.*|FROM john30/ebusd:v${VERSION} AS upstream|" \
            ebusd/Dockerfile
          # Add the upstream release section to our CHANGELOG.md. We extract only
          # the section for VERSION; it goes below the "# Unreleased" section,
          # which gets a line about the update and becomes VERSION.0 on release.
          curl -fsSL "https://raw.githubusercontent.com/john30/ebusd/${VERSION}/ChangeLog.md" \
            -o /tmp/upstream_changelog.md
          # Extract the section starting at "# VERSION" up to (not including) the next "# " heading
          awk "/^# ${VERSION} /{found=1} found && /^# / && !/^# ${VERSION} /{exit} found{print}" \
            /tmp/upstream_changelog.md > /tmp/new_entry.md
          .github/scripts/changelog-upstream.sh ebusd "${VERSION}" /tmp/new_entry.md
          echo "Bumped to ${VERSION} and added upstream entry to CHANGELOG.md"

      - name: Create Pull Request
        id: cpr
        if: steps.image.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: next
          commit-message: "Bump ebusd from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          title: "Bump ebusd from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            ## ebusd ${{ steps.latest.outputs.version }}

            | | Version |
            |---|---|
            | Before | `${{ steps.current.outputs.version }}` |
            | After  | `${{ steps.latest.outputs.version }}` |

            Full [ebusd release notes](https://github.com/john30/ebusd/releases/tag/${{ steps.latest.outputs.version }}).

            `ebusd/CHANGELOG.md` has been refreshed from upstream.

            Once this version reaches main, release.yaml builds, tests and publishes the app image.

            ---
            *Automated PR — created by the [update-ebusd workflow](.github/workflows/update-ebusd.yml)*
          branch: "update/ebusd-${{ steps.latest.outputs.version }}"
          delete-branch: true

      - name: Run CI for the Pull Request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update/ebusd-${{ steps.latest.outputs.version }}
        run: gh workflow run ci.yaml --ref "$BRANCH"
