# Dependency updates go to the next branch, grouped into one PR per ecosystem and week.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/ebusd"
    target-branch: "next"
    schedule:
      interval: "weekly"
    ignore:
      # bumped together with config.yaml by update-ebusd.yml
      - dependency-name: "john30/ebusd"
